<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 10 - لعبة التخمين العربية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2b3e50;
            --text-muted: #7f8c8d;
            --primary-green: #27ae60;
            --primary-green-hover: #219653;
            --accent-color: #2980b9;
            --danger-color: #c0392b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* اللوغو */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-top {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 2px;
            line-height: 1;
        }
        .logo-bottom {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-green);
            letter-spacing: 4px;
            line-height: 1;
            margin-top: 4px;
        }

        /* شاشة البداية والتصنيفات */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #fff;
            color: var(--text-main);
        }
        select:focus, input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
        }

        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 20px;
