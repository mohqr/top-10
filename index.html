<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 10 - لعبة التخمين التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-blue: #3b82f6;
            --primary-blue-hover: #2563eb;
            --accent-yellow: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        /* اللوغو الجديد الفخم */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(245, 158, 11, 0.1));
            padding: 15px;
            border-radius: 14px;
            border: 1px dashed var(--border-color);
        }
        .logo-top {
            font-size: 38px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 4px;
            line-height: 1;
            text-transform: uppercase;
        }
        .logo-bottom {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-yellow);
            letter-spacing: 6px;
            line-height: 1;
            margin-top: 6px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        /* شاشة البداية والتصنيفات */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }
        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #0f172a;
            color: var(--text-main);
        }
        select:focus, input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:hover {
            background-color: var(--primary-blue-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-accent {
            background-color: var(--accent-yellow);
            color: #0f172a;
        }
        .btn-accent:hover {
            background-color: #d97706;
            color: white;
        }
