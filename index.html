<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 10 - لعبة التخمين التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-blue: #3b82f6;
            --primary-blue-hover: #2563eb;
            --accent-yellow: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        /* اللوغو الجديد الفخم */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(245, 158, 11, 0.1));
            padding: 15px;
            border-radius: 14px;
            border: 1px dashed var(--border-color);
        }
        .logo-top {
            font-size: 38px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 4px;
            line-height: 1;
            text-transform: uppercase;
        }
        .logo-bottom {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-yellow);
            letter-spacing: 6px;
            line-height: 1;
            margin-top: 6px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        /* شاشة البداية والتصنيفات */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }
        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #0f172a;
            color: var(--text-main);
        }
        select:focus, input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:hover {
            background-color: var(--primary-blue-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-accent {
            background-color: var(--accent-yellow);
            color: #0f172a;
        }
        .btn-accent:hover {
            background-color: #d97706;
            color: white;
        }
        .btn-danger {
            background-color: var(--danger-color);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .random-box {
            display: flex;
            gap: 10px;
        }

        /* معلومات اللعبة */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        .question-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            max-width: 75%;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: 700;
        }
        .hearts {
            color: var(--danger-color);
            font-size: 18px;
        }

        /* صندوق الإدخال والاقتراحات */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .suggestions-box {
            position: absolute;
            top: 105%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            display: none;
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .suggestion-item:hover {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-yellow);
        }

        /* جدول النتائج */
        .table-container {
            max-height: 350px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            background: #1e293b;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 700;
        }
        .row-hidden {
            background-color: #1e293b;
            color: var(--text-muted);
        }
        .row-revealed {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            font-weight: 700;
        }
        .row-surrendered {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .actions-footer {
            display: flex;
            gap: 10px;
        }

        .download-guide {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوغو الجديد -->
        <div class="logo-container">
            <div class="logo-top">TOP</div>
            <div class="logo-bottom">10</div>
        </div>

        <!-- شاشة اختيار الأسئلة -->
        <div id="setupScreen" class="setup-section">
            <div class="select-group">
                <label>اختر التصنيف:</label>
                <select id="categorySelect" onchange="updateQuestionsList()">
                    <option value="geography">🌍 الجغرافيا والبلدان</option>
                    <option value="games">🎮 ألعاب فيديو</option>
                    <option value="football">⚽ كرة قدم</option>
                    <option value="movies">🎬 أفلام وسينما</option>
                </select>
            </div>
            <div class="select-group">
                <label>اختر السؤال:</label>
                <select id="questionSelect"></select>
            </div>
            
            <div class="random-box">
                <button class="btn" style="flex: 2;" onclick="startSelectedGame()">بدء السؤال المختار</button>
                <button class="btn btn-accent" style="flex: 1;" onclick="startRandomGame()">🎲 عشوائي</button>
            </div>
        </div>

        <!-- شاشة اللعب -->
        <div id="gameScreen" style="display: none;">
            <div class="game-header">
                <div id="activeQuestionTitle" class="question-title"></div>
                <button class="btn" style="padding: 6px 12px; font-size: 12px; background:#475569;" onclick="backToSetup()">القائمة</button>
            </div>

            <div class="stats-bar">
                <div id="scoreCounter">الإجابات الصحيحة: 0 / 10</div>
                <div class="hearts" id="heartsDisplay">❤️❤️❤️❤️❤️</div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="guessInput" placeholder="اكتب إجابتك هنا (عربي، إنجليزي، اختصار)..." oninput="handleInput()" autocomplete="off">
                <div id="suggestionsBox" class="suggestions-box"></div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 45px;">#</th>
                            <th>الإجابة</th>
                            <th style="width: 130px; text-align: left;" id="metricHeader">القيمة (تظهر عند الاستسلام)</th>
                        </tr>
                    </thead>
                    <tbody id="answersTableBody"></tbody>
                </table>
            </div>

            <div class="actions-footer">
                <button class="btn btn-danger" style="flex: 1;" onclick="surrenderGame()">استسلام وكشف الإجابات</button>
                <button class="btn btn-accent" style="flex: 1;" onclick="restartGame()">إعادة</button>
            </div>
        </div>

        <div class="download-guide">
            ✨ تم تحديث الثيم (أزرق وأصفر) وإضافة قسم الجغرافيا بالكامل!
        </div>
    </div>

            ],
            movies: [
                {
                    title: "أكثر 10 أفلام تحقيقاً للإيرادات في تاريخ السينما",
                    metricName: "الإيرادات",
                    answers: [
                        { name: "أفاتار", alt: ["avatar", "avatar 1"], value: "2.92 مليار" },
                        { name: "افينجرز اند جيم", alt: ["avengers endgame", "أفنجرز"], value: "2.79 مليار" },
                        { name: "تيتانيك", alt: ["titanic"], value: "2.26 مليار" },
                        { name: "ستار وورز ذا فورس اويكينز", alt: ["star wars the force awakens"], value: "2.07 مليار" },
                        { name: "أفاتار ذا ويه أوف ووتر", alt: ["avatar 2", "أفاتار 2"], value: "2.32 مليار" },
                        { name: "افينجرز إنفينيتي وور", alt: ["avengers infinity war"], value: "2.04 مليار" },
                        { name: "سبايدر مان نوي ويه هوم", alt: ["spider man no way home"], value: "1.92 مليار" },
                        { name: "جوراْسيك وورلد", alt: ["jurassic world"], value: "1.67 مليار" },
                        { name: "ذا لايون كينغ", alt: ["the lion king"], value: "1.66 مليار" },
                        { name: "ذا أفينجرز", alt: ["the avengers"], value: "1.52 مليار" }

                }

        let currentQuestion = null;
        let foundAnswers = [];
        let wrongAttempts = 5;
        let isGameOver = false;

        window.onload = function() {
            updateQuestionsList();
        };

        function updateQuestionsList() {
            const cat = document.getElementById('categorySelect').value;
            const qSelect = document.getElementById('questionSelect');
            qSelect.innerHTML = '';
            database[cat].forEach((q, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = q.title;
                qSelect.appendChild(opt);
            });
        }

        function startSelectedGame() {
            const cat = document.getElementById('categorySelect').value;
            const qIndex = document.getElementById('questionSelect').value;
            initGame(database[cat][qIndex]);
        }

        function startRandomGame() {
            let allQuestions = [];
            for (let cat in database) {
                allQuestions = allQuestions.concat(database[cat]);
            }
            const randomIndex = Math.floor(Math.random() * allQuestions.length);
            initGame(allQuestions[randomIndex]);
        }

        function initGame(questionObj) {
            currentQuestion = questionObj;
            foundAnswers = new Array(currentQuestion.answers.length).fill(false);
            wrongAttempts = 5;
            isGameOver = false;

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('activeQuestionTitle').textContent = currentQuestion.title;
            document.getElementById('metricHeader').textContent = currentQuestion.metricName;
            
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            
            renderTable();
            updateStats();
        }

        function backToSetup() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
        }

        function renderTable(revealedAll = false) {
            const tbody = document.getElementById('answersTableBody');
            tbody.innerHTML = '';

            currentQuestion.answers.forEach((ans, index) => {
                let tr = document.createElement('tr');
                let isFound = foundAnswers[index];

                if (isFound) {
                    tr.className = 'row-revealed';
                    tr.innerHTML = `<td>${index + 1}</td><td><strong>${ans.name}</strong></td><td style="text-align: left;">${ans.value}</td>`;
                } else if (revealedAll) {
                    tr.className = 'row-surrendered';
                    tr.innerHTML = `<td>${index + 1}</td><td>${ans.name}</td><td style="text-align: left;">${ans.value}</td>`;
                } else {
                    tr.className = 'row-hidden';
                    tr.innerHTML = `<td>${index + 1}</td><td>????????</td><td style="text-align: left;">-</td>`;
                }
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            const score = foundAnswers.filter(Boolean).length;
            document.getElementById('scoreCounter').textContent = `الإجابات الصحيحة: ${score} / 10`;
            document.getElementById('heartsDisplay').textContent = '❤️'.repeat(wrongAttempts);
        }

        function handleInput() {
            if (isGameOver) return;
            const inputVal = document.getElementById('guessInput').value.trim();
            const box = document.getElementById('suggestionsBox');

            if (inputVal.length < 2) {
                box.style.display = 'none';
                return;
            }

            checkGuess(inputVal, true);

            let matches = [];
            currentQuestion.answers.forEach((ans, idx) => {
                if (!foundAnswers[idx]) {
                    if (ans.name.includes(inputVal) || ans.alt.some(a => a.includes(inputVal))) {
                        matches.push(ans.name);
                    }
                }
            });

            if (matches.length > 0) {
                box.innerHTML = '';
                matches.slice(0, 5).forEach(m => {
                    let div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = m;
                    div.onclick = function() {
                        document.getElementById('guessInput').value = m;
                        box.style.display = 'none';
                        checkGuess(m, false);
                    };
                    box.appendChild(div);
                });
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        function cleanText(txt) {
            return txt.toLowerCase()
                .replace(/[أإآا]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/[^a-z0-9أ-ي]/g, '');
        }

        function checkGuess(val, isTypingCheck) {
            if (isGameOver) return;
            const cleanedInput = cleanText(val);
            if (!cleanedInput) return;

            let matchedIndex = -1;

            currentQuestion.answers.forEach((ans, idx) => {
                if (!foundAnswers[idx]) {
                    let mainClean = cleanText(ans.name);
                    let altCleans = ans.alt.map(a => cleanText(a));

                    if (cleanedInput === mainClean || altCleans.includes(cleanedInput)) {
                        matchedIndex = idx;
                    }
                }
            });

            if (matchedIndex !== -1) {
                foundAnswers[matchedIndex] = true;
                document.getElementById('guessInput').value = '';
                document.getElementById('suggestionsBox').style.display = 'none';
                renderTable();
                updateStats();

                if (foundAnswers.every(Boolean)) {
                    alert('🎉 كفو! لقد أجبت على جميع الأسئلة بنجاح!');
                    isGameOver = true;
                }
            } else if (!isTypingCheck) {
                wrongAttempts--;
                document.getElementById('guessInput').value = '';
                document.getElementById('suggestionsBox').style.display = 'none';
                updateStats();

                if (wrongAttempts <= 0) {
                    isGameOver = true;
                    alert('❌ انتهت محاولاتك!');
                    surrenderGame();
                }
            }
        }

        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess(this.value, false);
            }
        });

        function surrenderGame() {
            isGameOver = true;
            document.getElementById('guessInput').disabled = true;
            document.getElementById('suggestionsBox').style.display = 'none';
            renderTable(true);
        }

        function restartGame() {
            initGame(currentQuestion);
        }
    </script>
</body>
</html>
